name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Serialize runs per ref so two rapid pushes to master can't race the
# publish job into publishing against a stale registry version.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runtime compatibility: the engine itself on every supported Node.
  # No npm ci: the engine and its tests use only node built-ins, so
  # installing devDependencies here (eslint, typescript) is pure waste.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test

  # Node-version-independent checks, run once on current LTS. Kept separate
  # from the matrix because dev tooling (eslint 10+) does not support Node 18
  # even though the shipped engine does.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # index.d.ts must stay valid for consumers on older TypeScript, not just
      # the repo's own devDependency (TS 7 accepts declaration shapes TS 5
      # rejects, e.g. TS2309 - which shipped broken in 2.2.0).
      - run: npx -y -p typescript@5 tsc --noEmit --strict --target es2020 --module commonjs test/types.ts
      # Coverage report in the job log
      - run: node --test --experimental-test-coverage test/*.test.js

  publish:
    needs: [test, checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Check whether package.json version is newer than published
        id: version-check
        # Publish only when the local version is strictly NEWER than the
        # registry's. A plain != would also fire on an older local version
        # (e.g. after a revert), attempting a doomed publish that turns every
        # master push red. And if `npm view` fails (transient registry error),
        # fail the step - never guess.
        # Only plain X.Y.Z releases are supported: a prerelease string on
        # either side fails the step LOUDLY (Number("2-beta") is NaN, and NaN
        # comparisons are always false, which would otherwise skip publishes
        # silently forever with a green checkmark).
        run: |
          set -euo pipefail
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view nano-var-template version)
          echo "local=$LOCAL published=$PUBLISHED"
          SHOULD=$(node -e "
            const parse = v => {
              const m = /^(\d+)\.(\d+)\.(\d+)\$/.exec(v);
              if (!m) { console.error('gate only handles X.Y.Z releases, got: ' + v); process.exit(1); }
              return m.slice(1).map(Number);
            };
            const [l, p] = process.argv.slice(1).map(parse);
            const gt = l[0] !== p[0] ? l[0] > p[0] : l[1] !== p[1] ? l[1] > p[1] : l[2] > p[2];
            console.log(gt)" "$LOCAL" "$PUBLISHED")
          echo "should_publish=$SHOULD" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.version-check.outputs.should_publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
